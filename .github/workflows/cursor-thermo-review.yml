name: Cursor Thermo-Nuclear Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: cursor-thermo-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Launch Thermo-Nuclear Review
    permissions:
      contents: read
    uses: chroline/cursor-cloud-thermo-pr-review/.github/workflows/cursor-cloud-thermo-pr-review.yml@e180dc9d0e4cf9c9394ea6545b63bffcd4bc3fb7
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      publisher_client_id: ${{ secrets.CODE_REVIEW_PUBLISHER_CLIENT_ID }}
      publisher_private_key: ${{ secrets.CODE_REVIEW_PUBLISHER_PRIVATE_KEY }}
