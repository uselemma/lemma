name: Cursor Thermo-Nuclear Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: cursor-thermo-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Launch Thermo-Nuclear Review
    permissions:
      contents: read
    uses: uselemma/code-review/.github/workflows/lemma-cursor-thermo.yml@4550d4195c61bfe6e9e49b418a66aaeaf9554369
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      publisher_client_id: ${{ secrets.CODE_REVIEW_PUBLISHER_CLIENT_ID }}
      publisher_private_key: ${{ secrets.CODE_REVIEW_PUBLISHER_PRIVATE_KEY }}
