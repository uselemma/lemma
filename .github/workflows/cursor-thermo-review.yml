name: Cursor Thermo-Nuclear Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: cursor-thermo-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Launch Thermo-Nuclear Review
    permissions:
      contents: read
    uses: chroline/cursor-thermo-review/.github/workflows/lemma-cursor-thermo.yml@3b770a3fcb8b6e28c2163d632ecacde8436d0a5b
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      publisher_client_id: ${{ secrets.CODE_REVIEW_PUBLISHER_CLIENT_ID }}
      publisher_private_key: ${{ secrets.CODE_REVIEW_PUBLISHER_PRIVATE_KEY }}
