name: OpenClaw plugin

on:
  pull_request:
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - "packages/ts/tracing/**"
      - "plugins/lemma-openclaw/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - "packages/ts/tracing/**"
      - "plugins/lemma-openclaw/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @uselemma/openclaw type-check

      - name: Build distributable scripts
        run: pnpm --filter @uselemma/openclaw build

      - name: Test
        run: pnpm --filter @uselemma/openclaw test

      - name: Verify committed bundles
        run: git diff --exit-code -- plugins/lemma-openclaw/dist/index.js plugins/lemma-openclaw/runtime/flush.mjs plugins/lemma-openclaw/scripts/setup.mjs
