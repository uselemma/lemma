name: Cursor Thermo-Nuclear Review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: cursor-thermo-nuclear-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Launch Thermo-Nuclear Review
    permissions:
      contents: read
    uses: chroline/cursor-cloud-thermo-nuclear-pr-review/.github/workflows/cursor-cloud-thermo-nuclear-pr-review.yml@a4c168c12972ae59b3f8039068414f63d21e8fbc
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      publisher_client_id: ${{ secrets.CODE_REVIEW_PUBLISHER_CLIENT_ID }}
      publisher_private_key: ${{ secrets.CODE_REVIEW_PUBLISHER_PRIVATE_KEY }}
