name: Setup command

on:
  pull_request:
    paths:
      - ".github/workflows/setup-command.yml"
      - "packages/ts/setup/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-command.yml"
      - "packages/ts/setup/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @uselemma/setup type-check

      - name: Build
        run: pnpm --filter @uselemma/setup build

      - name: Test
        run: pnpm --filter @uselemma/setup test
